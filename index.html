<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087d80">
<meta name="description" content="海辺のアイス屋さんまで親子でドライブ。フリードスパイクとシエンタを見つけよう！">
<title>くるまみっけ！ 沖縄ドライブ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#082f36;color:#123f43;font-family:system-ui,sans-serif}body{height:100dvh}#game{position:absolute;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}#welcome{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 15%,#b8ecdd,transparent 60%),linear-gradient(140deg,#e9f5df,#70c9d2)}article{width:min(580px,100%);padding:clamp(20px,5vw,44px);border-radius:28px;background:#fffbed;box-shadow:0 24px 90px #084b5629}small{letter-spacing:.12em;color:#087d80}h1{font-size:clamp(28px,6vw,44px);margin:16px 0 6px}h2{font-size:22px;color:#087d80;margin:0 0 24px}p{line-height:1.8}button{border:0;border-radius:16px;padding:18px 28px;background:#087d80;color:white;font-size:20px;font-weight:700;cursor:pointer;width:100%;min-height:60px}button:disabled{opacity:.6}progress{width:100%;height:12px;accent-color:#087d80;margin-top:18px}#status{font-size:14px;margin-bottom:0}#rotate{display:none;position:fixed;inset:0;background:#fffbed;place-items:center;text-align:center;padding:30px;z-index:3;font-size:24px;line-height:1.8}a{color:#087d80}#tools{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:2px;font-size:12px;color:white;display:none;background:#123f43b0;padding:4px 10px;border-radius:6px;text-decoration:none;z-index:2}@media(orientation:portrait){body.playing #rotate{display:grid}}@media(max-height:450px){article{padding:18px 28px}h1{margin:8px 0;font-size:30px}h2{margin-bottom:8px}p{margin:8px 0}}
</style></head><body>
<main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="沖縄ドライブのゲーム画面"></canvas></main>
<section id="welcome"><article><small>FAMILY DRIVE · OKINAWA</small><h1>くるまみっけ！</h1><h2>沖縄ドライブ</h2><p>青い海を見ながら、親子でくるま探し。<br>パパはフリードスパイク、むすめはシエンタ！</p><p>スマホは横向きで。左右の発見ボタンは同時に押せます。<br>車は自動で進むので、小さなお子さまと一緒にどうぞ。</p><button id="start">ドライブの準備をする →</button><progress id="progress" value="0" max="1" hidden></progress><p id="status" role="status">初回はゲームの読み込みに時間がかかります。</p></article></section>
<div id="rotate">スマホを横にして遊んでね。<br>回転ロックを解除してください。</div>
<a href="#" id="tools">全画面</a>
<script>
const canvas=document.getElementById('unity-canvas'),start=document.getElementById('start'),status=document.getElementById('status'),progress=document.getElementById('progress');
let instance;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&instance)instance.SendMessage('GameSession','BrowserSuspend','');});
document.getElementById('tools').onclick=async e=>{e.preventDefault();try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{document.getElementById('tools').hidden=true;}};
start.onclick=async()=>{
 start.disabled=true;progress.hidden=false;status.textContent='海辺のドライブを準備しています…';
 try{
  if(!window.createUnityInstance) await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='Build/Web.loader.js';script.onload=resolve;script.onerror=()=>reject(new Error('読み込みに失敗しました。通信を確認して再読み込みしてください。'));document.body.appendChild(script);});
  instance=await createUnityInstance(canvas,{dataUrl:'Build/Web.data.unityweb',frameworkUrl:'Build/Web.framework.js.unityweb',codeUrl:'Build/Web.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:"LocalFamilyGames",productName:"くるまみっけ！沖縄ドライブ",productVersion:"0.1.0",devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),showBanner:(message,type)=>{if(type==='error'){status.textContent='起動できませんでした。最新のブラウザで再読み込みしてください。';console.error(message);}}},value=>{progress.value=value;status.textContent='読み込み中 '+Math.round(value*100)+'%';});
  document.getElementById('welcome').hidden=true;document.getElementById('welcome').style.display='none';document.body.classList.add('playing');if(document.fullscreenEnabled)document.getElementById('tools').style.display='block';canvas.focus();
 }catch(error){status.textContent='起動できませんでした。通信を確認して、最新のブラウザで再読み込みしてください。';start.textContent='再読み込み';start.disabled=false;start.onclick=()=>location.reload();console.error(error);}
};
</script></body></html>
